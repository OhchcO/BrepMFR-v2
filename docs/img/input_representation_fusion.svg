  <text class="small" x="140" y="557" text-anchor="middle">面节点＋邻接边</text>
  <text class="small" x="140" y="579" text-anchor="middle">属性、拓扑和面对几何</text>

  <rect class="panel-orange" x="38" y="618" width="204" height="237"/>
  <rect x="50" y="609" width="88" height="27" rx="14" fill="#df7119"/><text class="white" x="94" y="628" text-anchor="middle">创新点 1B</text>
