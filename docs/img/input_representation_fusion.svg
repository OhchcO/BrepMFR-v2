    <circle cx="37" cy="54" r="3.5" fill="#dd6d19"/><circle cx="65" cy="39" r="3.5" fill="#dd6d19"/><circle cx="91" cy="53" r="3.5" fill="#dd6d19"/><circle cx="119" cy="46" r="3.5" fill="#dd6d19"/><circle cx="79" cy="76" r="3.5" fill="#dd6d19"/>
