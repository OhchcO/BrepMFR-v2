  <rect class="column" x="25" y="25" width="230" height="850" fill="#e8eef2"/>
  <rect class="column" x="255" y="25" width="310" height="850" fill="#eaf4f8"/>
  <rect class="column" x="565" y="25" width="355" height="850" fill="#fff1e6"/>
  <rect class="column" x="920" y="25" width="400" height="850" fill="#e8f4f8"/>
  <rect class="column" x="1320" y="25" width="335" height="850" fill="#f0eafa"/>
  <line x1="25" y1="83" x2="1655" y2="83" stroke="#5d7484" stroke-width="1.5"/>
  <text class="section" x="140" y="62" text-anchor="middle">几何与拓扑源</text>
  <text class="section" x="410" y="62" text-anchor="middle">自适应参数采样</text>
  <text class="section" x="742" y="62" text-anchor="middle">多源输入契约</text>
  <text class="section" x="1120" y="62" text-anchor="middle">三分支编码</text>
  <text class="section" x="1487" y="62" text-anchor="middle">融合与令牌化</text>

