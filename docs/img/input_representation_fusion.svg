    <circle cx="16" cy="43" r="9" fill="#efb52d" stroke="#34566a"/><circle cx="53" cy="12" r="9" fill="#efb52d" stroke="#34566a"/><circle cx="111" cy="25" r="9" fill="#efb52d" stroke="#34566a"/><circle cx="151" cy="58" r="9" fill="#efb52d" stroke="#34566a"/><circle cx="61" cy="98" r="9" fill="#efb52d" stroke="#34566a"/><circle cx="88" cy="84" r="9" fill="#efb52d" stroke="#34566a"/><circle cx="121" cy="111" r="9" fill="#efb52d" stroke="#34566a"/>
