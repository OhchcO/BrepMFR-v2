  <style>
    text{font-family:"Microsoft YaHei","SimHei",sans-serif;fill:#12344a}.section{font-size:21px;font-weight:700}.subsection{font-size:16px;font-weight:700}.label{font-size:13px;font-weight:700}.body{font-size:11.5px}.small{font-size:10.5px}.tiny{font-size:9.5px}.formula{font-family:Cambria,"Times New Roman",serif;font-size:11.5px;font-style:italic}.formula-sm{font-family:Cambria,"Times New Roman",serif;font-size:10px;font-style:italic}.white{fill:#fff;font-size:12px;font-weight:700}
    .column{stroke:#5d7484;stroke-width:1.5}.panel{fill:#fff;fill-opacity:.83;stroke:#91a8b7;stroke-width:1.35;rx:8}.panel-orange{fill:#fffaf5;stroke:#df741e;stroke-width:1.5;rx:8}.panel-green{fill:#fbfffb;stroke:#4f8b6d;stroke-width:1.4;rx:8}.box{fill:#fff;stroke:#7893a4;stroke-width:1.3;rx:6}.box-orange{fill:#fff;stroke:#dd6d19;stroke-width:1.45;rx:6}.box-green{fill:#fff;stroke:#438574;stroke-width:1.4;rx:6}.box-cyan{fill:#fff;stroke:#278ca5;stroke-width:1.4;rx:6}.box-purple{fill:#fff;stroke:#7650a4;stroke-width:1.4;rx:6}
    .flow{fill:none;stroke:#245a78;stroke-width:2.4;marker-end:url(#arrow-blue)}.flow-thin{fill:none;stroke:#245a78;stroke-width:1.7;marker-end:url(#arrow-blue)}.dynamic{fill:none;stroke:#d66e1e;stroke-width:2.1;marker-end:url(#arrow-orange)}.bus{fill:none;stroke:#245a78;stroke-width:1.6}.icon-line{fill:none;stroke:#42677d;stroke-width:1.8}.icon-thin{fill:none;stroke:#6b8595;stroke-width:1.1}
  </style>
