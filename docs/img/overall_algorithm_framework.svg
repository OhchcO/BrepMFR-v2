<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#245a78"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d66e1e"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7045a2"/>
    </marker>
  </defs>

  <style type="text/css">
    text{font-family:"Microsoft YaHei","SimHei",sans-serif;fill:#17384e}
    .section{font-size:24px;font-weight:700}
    .title{font-size:19px;font-weight:700}
    .body{font-size:15px}
    .small{font-size:13px}
    .note{font-size:14px;font-weight:700}
    .formula{font-family:Cambria,"Times New Roman",serif;font-size:17px;font-style:italic}
    .formula-small{font-family:Cambria,"Times New Roman",serif;font-size:14px;font-style:italic}
    .white{fill:#ffffff;font-weight:700}
    .flow{fill:none;stroke:#245a78;stroke-width:3;marker-end:url(#arrow-blue)}
    .dynamic{fill:none;stroke:#d66e1e;stroke-width:3;marker-end:url(#arrow-orange)}
    .supervision{fill:none;stroke:#7045a2;stroke-width:2.6;stroke-dasharray:9 6;marker-end:url(#arrow-purple)}
    .icon-line{fill:none;stroke:#41677e;stroke-width:2.2}
    .icon-thin{fill:none;stroke:#6d8797;stroke-width:1.4}
  </style>

  <rect width="1680" height="900" fill="#ffffff"/>

  <!-- Five-column paper overview -->
  <rect x="25" y="25" width="285" height="850" fill="#e8eef2" stroke="#5d7484" stroke-width="1.5"/>
  <rect x="310" y="25" width="300" height="850" fill="#fff1e6" stroke="#5d7484" stroke-width="1.5"/>
  <rect x="610" y="25" width="325" height="850" fill="#e9f4f8" stroke="#5d7484" stroke-width="1.5"/>
  <rect x="935" y="25" width="420" height="850" fill="#e8f3e4" stroke="#5d7484" stroke-width="1.5"/>
  <rect x="1355" y="25" width="300" height="850" fill="#f0eafa" stroke="#5d7484" stroke-width="1.5"/>
  <line x1="25" y1="88" x2="1655" y2="88" stroke="#5d7484" stroke-width="1.5"/>

  <text class="section" x="167" y="65" text-anchor="middle">几何拓扑输入</text>
  <text class="section" x="460" y="65" text-anchor="middle">多源表征</text>
  <text class="section" x="772" y="65" text-anchor="middle">融合编码</text>
  <text class="section" x="1145" y="65" text-anchor="middle">关系感知推理</text>
  <text class="section" x="1505" y="65" text-anchor="middle">任务输出</text>

  <!-- 1. Combined geometric and topological input -->
  <rect data-role="major-box" x="47" y="118" width="241" height="692" rx="12" fill="#ffffff" stroke="#7893a4" stroke-width="1.8"/>
  <text class="title" x="167" y="151" text-anchor="middle">完整 B-rep 零件</text>

  <g transform="translate(72 174)">
    <path d="M22 82 L78 20 L178 53 L155 156 L55 147 Z" fill="#c99742" stroke="#675034" stroke-width="2.2"/>
    <path d="M22 82 L108 113 L178 53 M78 20 L83 135 M55 147 L108 113 L155 156" fill="none" stroke="#f4e8c9" stroke-width="1.5"/>
    <circle cx="78" cy="58" r="5" fill="#7354d8"/>
    <circle cx="132" cy="66" r="5" fill="#7354d8"/>
    <circle cx="99" cy="118" r="5" fill="#7354d8"/>
    <circle cx="45" cy="92" r="5" fill="#7354d8"/>
  </g>
  <text class="body" x="167" y="365" text-anchor="middle">精确曲面 · 拓扑边界 · 面集合</text>

  <line x1="68" y1="395" x2="267" y2="395" stroke="#b6c5cf" stroke-width="1.5"/>
  <path class="flow" d="M167 375 V414"/>
  <text class="title" x="167" y="445" text-anchor="middle">属性邻接图 AAG</text>

  <g transform="translate(72 477)">
    <path class="icon-line" d="M18 54 L63 20 M18 54 L75 108 M63 20 L125 32 M63 20 L91 84 M125 32 L173 67 M125 32 L91 84 M173 67 L145 127 M173 67 L91 84 M75 108 L91 84 M75 108 L145 127 M91 84 L145 127"/>
    <circle cx="18" cy="54" r="11" fill="#efb52d" stroke="#34566a" stroke-width="1.7"/>
    <circle cx="63" cy="20" r="11" fill="#efb52d" stroke="#34566a" stroke-width="1.7"/>
    <circle cx="125" cy="32" r="11" fill="#efb52d" stroke="#34566a" stroke-width="1.7"/>
    <circle cx="173" cy="67" r="11" fill="#efb52d" stroke="#34566a" stroke-width="1.7"/>
    <circle cx="75" cy="108" r="11" fill="#efb52d" stroke="#34566a" stroke-width="1.7"/>
    <circle cx="91" cy="84" r="11" fill="#efb52d" stroke="#34566a" stroke-width="1.7"/>
    <circle cx="145" cy="127" r="11" fill="#efb52d" stroke="#34566a" stroke-width="1.7"/>
  </g>
  <text class="body" x="167" y="647" text-anchor="middle">面为节点 · 邻接关系为边</text>
  <rect x="69" y="677" width="196" height="83" rx="9" fill="#eef4f7" stroke="#9bb0bd" stroke-width="1.3"/>
  <text class="note" x="167" y="708" text-anchor="middle">保留原始 B-rep 面顺序</text>
  <text class="small" x="167" y="735" text-anchor="middle">几何属性与拓扑结构共同进入模型</text>

  <!-- 2. Intrinsic parametric surface representation -->
  <rect data-role="major-box" x="332" y="118" width="256" height="292" rx="12" fill="#fffaf5" stroke="#df741e" stroke-width="2"/>
  <rect x="350" y="105" width="112" height="31" rx="15" fill="#df7119"/>
  <text class="white" x="406" y="126" text-anchor="middle" font-size="13">创新点 1A</text>
  <text class="title" x="460" y="164" text-anchor="middle">内蕴度量参数曲面表征</text>

  <g transform="translate(358 190)">
    <path d="M4 77 L84 25 L190 70 L108 129 Z" fill="#bde4f3" stroke="#3e7997" stroke-width="1.7"/>
    <path class="icon-thin" d="M25 64 L128 112 M54 46 L158 94 M84 26 L187 72 M38 56 L25 91 M70 37 L53 111 M102 34 L84 125 M135 47 L116 123 M166 59 L149 105"/>
    <circle cx="33" cy="62" r="5" fill="#e77822"/>
    <circle cx="73" cy="54" r="5" fill="#e77822"/>
    <circle cx="111" cy="66" r="5" fill="#e77822"/>
    <circle cx="151" cy="76" r="5" fill="#e77822"/>
    <circle cx="75" cy="89" r="5" fill="#e77822"/>
    <circle cx="118" cy="101" r="5" fill="#e77822"/>
  </g>
  <text class="body" x="460" y="349" text-anchor="middle">保持精确曲面参数域</text>
  <text class="body" x="460" y="377" text-anchor="middle">按局部内蕴关系组织几何样本</text>

  <!-- 3. Part-level position and AAG attributes -->
  <rect data-role="major-box" x="332" y="450" width="256" height="310" rx="12" fill="#fffaf5" stroke="#df741e" stroke-width="2"/>
  <rect x="350" y="437" width="112" height="31" rx="15" fill="#df7119"/>
  <text class="white" x="406" y="458" text-anchor="middle" font-size="13">创新点 1B</text>
  <text class="title" x="460" y="498" text-anchor="middle">全局位置与 AAG 属性</text>

  <g transform="translate(360 525)">
    <ellipse cx="70" cy="33" rx="55" ry="22" fill="#d8e4ea" stroke="#52768a" stroke-width="1.6"/>
    <path d="M15 33 V116 M125 33 V116" fill="none" stroke="#52768a" stroke-width="1.6"/>
    <ellipse cx="70" cy="116" rx="55" ry="22" fill="#a9bfca" stroke="#52768a" stroke-width="1.6"/>
    <line x1="70" y1="116" x2="70" y2="12" stroke="#2a678b" stroke-width="1.6"/>
    <line x1="70" y1="116" x2="119" y2="86" stroke="#df7119" stroke-width="2"/>
    <line x1="70" y1="116" x2="70" y2="66" stroke="#df7119" stroke-width="2"/>
    <circle cx="70" cy="116" r="4.5" fill="#df7119"/>
    <text class="small" x="76" y="18">z</text>
    <text class="small" x="122" y="84">r, θ</text>
    <g transform="translate(144 18)">
      <path class="icon-line" d="M8 42 L38 14 M8 42 L42 76 M38 14 L78 26 M38 14 L53 57 M78 26 L95 56 M78 26 L53 57 M95 56 L74 82 M95 56 L53 57 M42 76 L53 57 M42 76 L74 82"/>
      <circle cx="8" cy="42" r="6" fill="#efb52d"/><circle cx="38" cy="14" r="6" fill="#efb52d"/><circle cx="78" cy="26" r="6" fill="#efb52d"/><circle cx="95" cy="56" r="6" fill="#efb52d"/><circle cx="42" cy="76" r="6" fill="#efb52d"/><circle cx="53" cy="57" r="6" fill="#efb52d"/><circle cx="74" cy="82" r="6" fill="#efb52d"/>
    </g>
  </g>
  <text class="body" x="460" y="689" text-anchor="middle">零件级统一柱坐标位置</text>
  <text class="body" x="460" y="718" text-anchor="middle">融合面属性与拓扑结构描述</text>
  <text class="note" x="460" y="824" text-anchor="middle" fill="#b35a18">输入表征与编码细节见图二</text>

  <!-- 4. Three-branch encoders -->
  <rect data-role="major-box" x="632" y="118" width="280" height="302" rx="12" fill="#ffffff" stroke="#4f91ad" stroke-width="1.9"/>
  <text class="title" x="772" y="158" text-anchor="middle">多源三分支编码</text>
  <text class="body" x="772" y="188" text-anchor="middle">分别提取互补的面级信息</text>

  <rect x="659" y="224" width="60" height="125" rx="8" fill="#ec8a38"/>
  <rect x="742" y="224" width="60" height="125" rx="8" fill="#3c8173"/>
  <rect x="825" y="224" width="60" height="125" rx="8" fill="#4597b0"/>
  <text class="white" x="689" y="253" text-anchor="middle" font-size="14">曲面</text>
  <text class="white" x="689" y="276" text-anchor="middle" font-size="14">层次</text>
  <text class="white" x="689" y="299" text-anchor="middle" font-size="14">编码</text>
  <text class="white" x="772" y="253" text-anchor="middle" font-size="14">AAG</text>
  <text class="white" x="772" y="276" text-anchor="middle" font-size="14">属性</text>
  <text class="white" x="772" y="299" text-anchor="middle" font-size="14">编码</text>
  <text class="white" x="855" y="253" text-anchor="middle" font-size="14">位置</text>
  <text class="white" x="855" y="276" text-anchor="middle" font-size="14">关系</text>
  <text class="white" x="855" y="299" text-anchor="middle" font-size="14">编码</text>
  <text class="small" x="689" y="376" text-anchor="middle">局部几何</text>
  <text class="small" x="772" y="376" text-anchor="middle">拓扑语义</text>
  <text class="small" x="855" y="376" text-anchor="middle">全局方位</text>

  <!-- 5. Gated fusion and graph sequence -->
  <rect data-role="major-box" x="632" y="472" width="280" height="288" rx="12" fill="#ffffff" stroke="#4f91ad" stroke-width="1.9"/>
  <text class="title" x="772" y="512" text-anchor="middle">以 AAG 为基础的门控融合</text>
  <text class="body" x="772" y="545" text-anchor="middle">选择性注入曲面与位置特征</text>

  <rect x="665" y="580" width="214" height="62" rx="9" fill="#3179a0"/>
  <text class="white" x="772" y="607" text-anchor="middle" font-size="15">面级初始嵌入</text>
  <text x="772" y="631" text-anchor="middle" style="font-family:Cambria,serif;font-size:17px;font-style:italic;fill:#ffffff">H⁰={hᵢ⁰}</text>
  <path class="flow" d="M772 642 V673"/>
  <text class="body" x="772" y="700" text-anchor="middle">独立可学习图级令牌 g⁰</text>
  <rect x="665" y="714" width="214" height="54" rx="9" fill="#245a78"/>
  <text x="772" y="748" text-anchor="middle" style="font-family:Cambria,serif;font-size:18px;font-style:italic;fill:#ffffff">X⁰=[g⁰;H⁰]</text>

  <!-- 6. Relationship-aware graph transformer -->
  <rect data-role="major-box" x="957" y="118" width="376" height="642" rx="12" fill="#ffffff" stroke="#5c9253" stroke-width="2"/>
  <text class="title" x="1145" y="155" text-anchor="middle">关系感知图变换器</text>
  <text class="small" x="1145" y="180" text-anchor="middle">先预测实例关系，再增强后两层注意力</text>

  <!-- Stage 1: early/base encoding -->
  <rect data-role="reasoning-stage" x="982" y="204" width="326" height="142" rx="11" fill="#fbfffb" stroke="#5c9253" stroke-width="1.8"/>
  <rect x="1001" y="220" width="288" height="40" rx="8" fill="#5b9153"/>
  <text class="white" x="1145" y="246" text-anchor="middle" font-size="16">前层基础编码</text>
  <text class="body" x="1145" y="289" text-anchor="middle">X⁰ ＋ 固定结构偏置 B_AAG</text>
  <text class="small" x="1145" y="315" text-anchor="middle">学习语义与拓扑上下文</text>
  <rect x="1060" y="325" width="170" height="38" rx="8" fill="#3d8171"/>
  <text x="1145" y="350" text-anchor="middle" style="font-family:Cambria,serif;font-size:16px;font-style:italic;fill:#ffffff">中间面特征 H_mid</text>

  <!-- Stage 2: IAAB instance relationship prediction -->
  <path class="flow" d="M1145 363 V391"/>
  <rect data-role="reasoning-stage" x="982" y="391" width="326" height="151" rx="11" fill="#fcf9ff" stroke="#7650a4" stroke-width="1.8"/>
  <rect x="999" y="378" width="112" height="30" rx="15" fill="#7444a7"/>
  <text class="white" x="1055" y="399" text-anchor="middle" font-size="13">创新点 2</text>
  <text class="title" x="1145" y="431" text-anchor="middle">IAAB 实例关系预测</text>
  <text class="body" x="1145" y="462" text-anchor="middle">由 H_mid 预测面—面亲和关系</text>
  <text class="small" x="1145" y="488" text-anchor="middle">关系预测位于中间层，不是最终任务头</text>
  <rect x="1052" y="503" width="186" height="42" rx="8" fill="#7444a7"/>
  <text x="1145" y="530" text-anchor="middle" style="font-family:Cambria,serif;font-size:16px;font-style:italic;fill:#ffffff">动态实例偏置 B_inst</text>

  <!-- Stage 3: relation-biased final layers -->
  <path class="dynamic" d="M1145 545 V574"/>
  <rect data-role="reasoning-stage" x="982" y="574" width="326" height="154" rx="11" fill="#fffaf5" stroke="#df741e" stroke-width="1.8"/>
  <text class="title" x="1145" y="608" text-anchor="middle">后两层偏置增强</text>
  <rect x="1027" y="625" width="236" height="43" rx="8" fill="#df7119"/>
  <text x="1145" y="653" text-anchor="middle" style="font-family:Cambria,serif;font-size:17px;font-style:italic;fill:#ffffff">B_AAG + B_inst</text>
  <text class="body" x="1145" y="694" text-anchor="middle">关系感知注意力计算</text>
  <text class="formula" x="1145" y="718" text-anchor="middle">最终表示 H⁸、g⁸</text>

  <text class="note" x="1145" y="824" text-anchor="middle" fill="#7045a2">IAAB 与后层注入细节见图三</text>

  <!-- 8. Semantic prediction -->
  <rect data-role="major-box" x="1377" y="118" width="256" height="352" rx="12" fill="#fbfffb" stroke="#5c9253" stroke-width="2"/>
  <text class="title" x="1505" y="158" text-anchor="middle">面级加工特征识别</text>
  <text class="body" x="1505" y="193" text-anchor="middle">融合局部面特征与全局图表示</text>

  <rect x="1407" y="229" width="196" height="68" rx="10" fill="#5b9153"/>
  <text class="white" x="1505" y="257" text-anchor="middle" font-size="15">局部—全局融合</text>
  <text x="1505" y="283" text-anchor="middle" style="font-family:Cambria,serif;font-size:14px;font-style:italic;fill:#ffffff">hᵢ⁸ ⊕ g⁸</text>
  <path class="flow" d="M1505 297 V324"/>
  <rect x="1407" y="324" width="196" height="62" rx="10" fill="#3179a0"/>
  <text class="white" x="1505" y="361" text-anchor="middle" font-size="15">输出每个 B-rep 面的类别</text>
  <g transform="translate(1437 409)">
    <circle cx="0" cy="0" r="7" fill="#5a93ba"/><circle cx="43" cy="-10" r="7" fill="#55a46c"/><circle cx="81" cy="13" r="7" fill="#efb52d"/><circle cx="25" cy="36" r="7" fill="#7444a7"/><circle cx="69" cy="43" r="7" fill="#55a46c"/><circle cx="111" cy="28" r="7" fill="#5a93ba"/>
    <line x1="0" y1="0" x2="43" y2="-10" stroke="#42677d" stroke-width="1.8"/><line x1="43" y1="-10" x2="81" y2="13" stroke="#42677d" stroke-width="1.8"/><line x1="0" y1="0" x2="25" y2="36" stroke="#42677d" stroke-width="1.8"/><line x1="43" y1="-10" x2="25" y2="36" stroke="#42677d" stroke-width="1.8"/><line x1="43" y1="-10" x2="69" y2="43" stroke="#42677d" stroke-width="1.8"/><line x1="81" y1="13" x2="111" y2="28" stroke="#42677d" stroke-width="1.8"/><line x1="25" y1="36" x2="69" y2="43" stroke="#42677d" stroke-width="1.8"/><line x1="69" y1="43" x2="111" y2="28" stroke="#42677d" stroke-width="1.8"/>
  </g>

  <!-- 9. Learning objectives -->
  <rect data-role="major-box" x="1377" y="520" width="256" height="240" rx="12" fill="#fcf9ff" stroke="#7650a4" stroke-width="2"/>
  <text class="title" x="1505" y="560" text-anchor="middle">多任务学习目标</text>
  <rect x="1407" y="593" width="196" height="70" rx="10" fill="#7444a7"/>
  <text x="1505" y="622" text-anchor="middle" style="font-family:Cambria,serif;font-size:17px;font-weight:700;fill:#ffffff">L=L_sem+λ(t)L_aff</text>
  <text x="1505" y="649" text-anchor="middle" style="font-size:13px;fill:#ffffff">语义损失＋实例亲和辅助损失</text>
  <text class="body" x="1505" y="703" text-anchor="middle">训练：联合学习语义与实例关系</text>
  <text class="note" x="1505" y="735" text-anchor="middle">推理无需实例标签</text>

  <!-- Orthogonal functional data flow -->
  <path class="flow" d="M288 266 H332"/>
  <path class="flow" d="M288 610 H315 V605 H332"/>
  <path class="dynamic" d="M588 266 H610 V270 H632"/>
  <path class="dynamic" d="M588 605 H610 V328 H632"/>
  <path class="flow" d="M772 420 V472"/>
  <path class="flow" d="M912 741 H940 V275 H982"/>
  <path class="flow" d="M1308 701 H1345 V294 H1377"/>
  <path class="flow" d="M1505 470 V520"/>
  <path class="supervision" d="M1308 466 H1365 V640 H1377"/>

  <!-- Compact reading guide -->
  <rect x="47" y="834" width="1264" height="25" rx="12" fill="#ffffff" fill-opacity="0.72" stroke="#a9bbc6" stroke-width="1"/>
  <text class="small" x="679" y="852" text-anchor="middle">主线：精确几何与拓扑 → 多源表征 → 门控融合 → 关系感知推理 → 面级加工特征识别</text>
